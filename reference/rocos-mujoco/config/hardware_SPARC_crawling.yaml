# SPARC 七轴仿真硬件配置，PDO 字段沿用 hardware_talon_config.yaml。
# 模型：Model/urdf/scene_hexagon.xml 和 Model/urdf/SPARC.urdf。
# 七轴均为 continuous，模型未定义位置/速度/力矩限制；以下 limit 是仿真
# 控制器的默认软限制，并非真实机械限位。acc/jerk/编码器比例沿用 Talon
# 作为仿真换算参数；全部零位偏置清零，真实硬件参数需另行标定。
# 六锚点爬行：MoveL 抬升 5 cm -> 换端 IK + MoveJ -> MoveL 下降对接。
# 场景中的 freejoint root 不属于 EtherCAT 驱动。
hardware:
  # joint_1 (slave id=0)
  - id: 0
    type: driver
    joint_name: joint_1
    torque_source: load_torque
    limit:
      lower: -3.141592653589793
      upper: 3.141592653589793
      vel: 3.0
      acc: 0.5
      jerk: 5.0
      effort: 30.0
    transform:
      ratio: 1.0
      offset_pos_cnt: 0
      cnt_per_unit: 156455.678
      torque_per_unit: 1.0
      user_unit_name: rad
    inputs:
      digital_inputs: "Digital Inputs"
      status_word: "Status word"
      position_actual_value: "Position actual value"
      velocity_actual_value: "Velocity actual value"
      torque_actual_value: "Torque actual value"
      load_torque_value: "Analog Input 1"
      secondary_position_value: "Auxiliary position actual value"
    outputs:
      digital_outputs: "Digital Outputs"
      control_word: "Control word"
      mode_of_operation: "Mode of operation"
      target_position: "Target Position"
      target_velocity: "Target Velocity"
      target_torque: "Target Torque"

