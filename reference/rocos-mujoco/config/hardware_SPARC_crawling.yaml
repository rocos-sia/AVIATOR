# Both clients and simulator use this same PDO and anchor configuration.
crawling:
  enabled: true
  io_slave: 0
  joint_damping: 20.0
  position_tolerance: 0.001
  rotation_tolerance: 0.01745329252
  linear_speed_tolerance: 0.003
  angular_speed_tolerance: 0.01745329252
  stable_time: 0.15
  initial_joint_positions: [0.134404292695, 0, -1.021539904009, -1.10097286314, 1.019079886439, 0, -1.181601843892]
  anchor_spacing: 1.0
  joint_speed: 0.5
  anchors: # Clockwise viewed from +Z; adjacent spacing = 1 m.
    - {position: [0, 0, 0], yaw: 0}
    - {position: [0, 1, 0], yaw: -1.0471975511966}
    - {position: [0.866025403784439, 1.5, 0], yaw: -2.0943951023932}
    - {position: [1.73205080756888, 1, 0], yaw: -3.14159265358979}
    - {position: [1.73205080756888, 0, 0], yaw: -4.18879020478639}
    - {position: [0.866025403784439, -0.5, 0], yaw: -5.23598775598299}
