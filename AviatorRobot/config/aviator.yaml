# Aviator 双臂控制配置。
# 路径相对于本 YAML 文件所在目录解析；修改后需重启控制程序生效。

# 控制用 URDF：包含双臂运动链、物理关节限位及 14 个驱动的硬件映射。
urdf: aviator_control.urdf

# 离线轨迹检查使用的 MuJoCo 模型，用于运动学一致性和碰撞检查。
# 构建目录运行时，若此路径不存在，控制器会查找 bin/model/aviator.xml。
model: ../../reference/rocos-mujoco/model/aviator.xml

# 抓取配置：圆柱工具尺寸、法兰到工具的变换、把手几何及左右抓取位姿。
# 其中位置/尺寸单位为 m，四元数顺序为 [w, x, y, z]。
grasp: grasp.json

# 姿态配置：双臂初始角度、接近逆解种子及 J2 范围，角度单位为度。
# 当前 J2 要求为 85°～95°，规划时向内预留 0.5° 跟踪余量。
posture: posture.json

# 第一阶段：关节空间运动到预接近位置的基准时长，单位 s，必须 >= 1。
# 实际时长会根据关节位移和 joint_speed 自动延长，以限制运动速度。
approach_duration: 4.0

# 第二阶段：从预接近位置沿笛卡尔路径对准把手的时长，单位 s，必须 >= 1。
# 此阶段不会自动延长时间；若规划速度超限，需要增大此值。
final_approach_duration: 3.0

# 轨迹规划采样间隔，单位 s，允许范围为 (0, 0.05]；0.02 对应 20 ms。
# 每个采样点求双臂逆解，并检查关节限位、速度和碰撞；还检查相邻点中点的碰撞。
# 采样越密，规划计算量越大。底层伺服控制周期独立，为 1 ms。
planning_period: 0.02

# 各机械臂关节的轨迹规划速度上限，单位 rad/s；0.7 约为 40.1°/s。
# 每个关节取本值与其 URDF 速度限位中的较小值，规划超限时拒绝执行。
# MoveWheel 的时间参数过小，也可能触发此限制。
joint_speed: 6.28

# 执行中的关节跟踪误差阈值，单位 rad；0.12 约为 6.88°。
# 任一关节实测角度与上一周期目标角度的误差达到此值，会中止运动并保持当前位置。
tracking_tolerance: 0.12

# 操纵盘运动结束时，实测转角与目标转角的允许误差，单位 rad；0.015 约为 0.86°。
# 稳定判定还要求抓取位姿误差和操纵盘速度满足条件。
wheel_angle_tolerance: 0.015

# 操纵盘运动结束时，实测推拉位置与目标位置的允许误差，单位 m；0.003 为 3 mm。
wheel_translation_tolerance: 0.003
