<ellipse cx="100" cy="2222" rx="30" ry="22" fill="#d7b958" stroke="#6288d5" stroke-width="2"/>
<text x="145" y="2230" font-size="22" text-anchor="start" class="">初始状态</text>
<ellipse cx="370" cy="2222" rx="30" ry="22" fill="#fde4e5" stroke="#6288d5" stroke-width="2"/>
<text x="415" y="2230" font-size="22" text-anchor="start" class="">过渡状态</text>
<ellipse cx="640" cy="2222" rx="30" ry="22" fill="#527bc5" stroke="#6288d5" stroke-width="2"/>
<text x="685" y="2230" font-size="22" text-anchor="start" class="">稳定 / 保护状态</text>
<rect x="920" y="2200" width="70" height="44" rx="22" fill="#eae3fb" stroke="#282b30" stroke-width="2" stroke-dasharray="4 5"/>
<text x="1005" y="2230" font-size="22" text-anchor="start" class="">异步执行</text>
<path d="M1200 2222 H1300" class="edge"/>
<text x="1320" y="2230" font-size="22" text-anchor="start" class="">事件 / 状态流转</text>
<path d="M1590 2222 H1690" class="edge" stroke-dasharray="5 6"/>
<text x="1710" y="2230" font-size="22" text-anchor="start" class="">动作提交</text>
<text x="1995" y="2230" font-size="22" text-anchor="start" class="note">[G] 转换条件    [D] 完成条件</text>
