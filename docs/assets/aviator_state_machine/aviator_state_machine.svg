<title>AVIATOR 整机状态机流转图</title><desc>依据 RobotStateMachine.hpp 和 Aviator::Managed，含十二状态、六操作、异步任务、保护及恢复路径。下方 HOMING 与 RELEASING 是上方同名状态的引用。</desc>
<text x="85" y="82" font-size="44" text-anchor="start" class="" font-weight="700">AVIATOR 整机状态机</text>
<text x="85" y="127" font-size="25" text-anchor="start" class="note">Managed 模式 · 12 个状态 · 6 个外部操作 · 单任务异步执行</text>
<text x="2515" y="83" font-size="22" text-anchor="end" class="note">与当前代码一致</text>
<path d="M244 285 C335 285 404 285 496 285" class="edge"/>
