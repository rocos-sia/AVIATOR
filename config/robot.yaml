# Aviator 双臂控制配置。
# 路径相对于本 YAML 文件所在目录解析；修改后需重启控制程序生效。

# manipulator 按此字段选择 MuJoCo 或 Rokae；Core 的算法和通信不变。
# 所有路径均相对本文件；真机也复用下面的运动学、碰撞和轨迹参数。
# backend: mujoco
# viewer: true  # MuJoCo 窗口；--headless 可覆盖为关闭
backend: rokae
model: ../models/control/aviator.xml

# 启动时轮盘的实际初始位形；真机声明软件参考，仿真同时设置轮盘关节初值。
# 沿用原几何零位，不改变 grasp.json。摇杆中位对应 displacement=-0.085 m。
wheel_initial:
  angle: 0.0              # rad
  displacement: -0.085    # m，允许 [-0.170, 0]

rokae:
  # 只有双臂反馈：轮盘位形使用指令参考，lock/unlock 仅切换软件控制阶段。
  grasp_mode: open_loop
  # 真机所有已使能运动/保持都使用关节阻抗；顺序为 J1...J7，单位 Nm/rad。
  joint_stiffness: [500, 500, 500, 500, 50, 50, 50]
  # 每臂分别指定控制器 IP 和上位机本地 IP；本地地址须已配置在对应网卡上。
  # 建议使用有线连接；此处配置不会修改上位机网卡地址。
  left_ip: 192.168.1.160
  right_ip: 192.168.2.160
  left_local_ip: 192.168.1.100
  right_local_ip: 192.168.2.100

# 控制用 URDF：包含双臂运动链、物理关节限位及 14 个驱动的硬件映射。
# urdf: ../models/control/aviator_control.urdf
urdf: ../models/urdf/aviator.urdf
# 离线轨迹检查使用的 Pinocchio 碰撞 URDF（由 scripts/generate_aviator.py 导出，
# 分片凸网格 + 圆柱/胶囊工具 + SRDF 排除对），用于碰撞检查。
# 模型资源位于 AVIATOR/models/control，路径仅相对本配置解析。
collision_urdf: ../models/control/aviator_collision.urdf
# Core 规划碰撞检查，仿真/真机共用；省略时默认 true。
# false 跳过所有规划碰撞检查（含自碰撞、双臂互碰和环境碰撞），不加载碰撞模型。
# 关节位置限位、通信超时和 SDK 故障检查仍生效；不改变控制器自身保护。
collision_check_enabled: false

# 抓取配置：圆柱工具尺寸、法兰到工具的变换、把手几何及左右抓取位姿。
# 其中位置/尺寸单位为 m，四元数顺序为 [w, x, y, z]。
grasp: grasp.json

# 姿态配置：双臂初始角度、接近逆解种子及 J2 范围，角度单位为度。
# 当前 J2 要求为 85°～94°，规划时向内预留 0.5° 跟踪余量。
posture: posture.json

# Ruckig 自动计算时长；以下为关节峰值约束，两臂共用同步轨迹。
# Managed STANDBY requires actual joint positions within this tolerance of home (rad).
home_position_tolerance: 0.15
home_speed: 0.2          # 当前位置 → home，rad/s
approach_speed: 0.2      # home → 预接近位置，rad/s
joint_acceleration: 0.5  # Home、预接近关节加速度上限，rad/s²
joint_jerk: 1.0          # Home、预接近关节加加速度上限，rad/s³

# 第三阶段：从预接近位置沿笛卡尔路径对准把手的时长，单位 s，必须 >= 1。
# 此阶段不会自动延长时间；若规划速度超限，需要增大此值。
final_approach_duration: 3.0

# 轨迹规划采样间隔，单位 s，允许范围为 (0, 0.05]；0.02 对应 20 ms。
# 每个采样点求双臂逆解，并检查关节限位和速度；启用碰撞检查时还检查采样点及中点碰撞。
# 采样越密，规划计算量越大。底层伺服控制周期独立，为 1 ms。
planning_period: 0.05

# 各机械臂关节的轨迹规划速度上限，单位 rad/s。
# Home/Approach/MoveWheel 取本值与 URDF 限位中的较小值。
# Servo 不按 joint_speed/joint_acceleration/joint_jerk 拦截，仍保留底层指令防跳变保护。
joint_speed: 1.9

# 后端故障/通信失效时的关节制动加速度上限，单位 rad/s²。
# 正常 Servo 停止/输入超时由 Ruckig 按下列轮盘加速度和 jerk 约束减速。
# 双臂用同一个减速比例；停止后保持最终指令，不跳到实测角度。
# 反馈故障或制动路径不安全时直接停止 SDK 控制。
stop_acceleration: 2.0

# 不按关节跟踪偏差中止运动；仍检查反馈时效、关节限位和 SDK 故障。
# Direct Demo 的 home 仅确认停稳；Managed 回 home 另检查 home_position_tolerance，超时停止。

# 运动结束后的开环驻留时间，单位 s。统一仿真与真机：只按时间等待运动收尾，
# 不校验轮盘是否停稳；期间保留取消/故障/肘部安全检查。
settle_duration: 0.3

# v=1 时的轮盘速度上限；MoveWheel 自动协调时间并受各关节速度进一步约束。
wheel_angular_speed: 1.8   # rad/s
wheel_linear_speed: 0.5   # m/s

# Servo 在线规划的轮盘加速度、加加速度上限；换目标时继承当前速度/加速度。
# 以下为保守起始值，不能仅增大轮盘约束而忽略关节限位和奇异位形。
wheel_angular_acceleration: 2.0  # rad/s²
wheel_linear_acceleration: 1.0 # m/s²
wheel_angular_jerk: 4.0        # rad/s³
wheel_linear_jerk: 2.0       # m/s³

# 在线规划块周期，必须是整毫秒；Core 提前缓存约 80..100 ms。
# 连续 q/dq/ddq 曲线按 1 ms 采样原样发送，两臂共用执行游标。
servo_period: 0.02
# 按实际接收时间计时；超时后执行已提交的短缓冲，再按 jerk 约束减速并保持锁定。
servo_timeout: 0.25
