# RH56FTP 启动时加载；修改后重启节点生效。六个通道统一使用下列参数。
# 节点固定设置运动模式 0（按角度运动，带力阈值保护）。
speed: 500                     # 速度寄存器设定，整数 0..1000
force: 2500                     # 力寄存器设定，整数 0..3000

# 握持自动减载。四项阈值采用原始寄存器整数刻度，直接与反馈比较，不做单位换算。
# 当前已启用；默认值为初始调试值，需结合实机负载验证。
# 阈值可用标量或六项数组：[拇指侧摆, 拇指弯曲, 食指, 中指, 无名指, 小指]。
# 左右手共用；侧摆仅监测，不自动松开。参数变更后重启节点生效。
# 长期负载阈值只在该手完成抓握后启用，抓握/张开运动期间不累计超限。
hold_control:
  enabled: true
  current_limit: 100          # 电流反馈寄存器刻度，整数 0..2000（设备无对应电流设置指令）
  force_limit: 300            # 受力幅值阈值，整数 0..3000，与 force 指令同刻度
  min_force: 50               # 最低接触/保持力，整数 0..3000；小于 force_limit * recovery_ratio
  temperature_limit: 50       # 温度反馈寄存器刻度，整数 0..100；保持阶段达到即锁存故障
  close_timeout_ms: 30000      # 仍有闭合残差且未确认稳定接触的最长时间
  overload_ms: 1000            # 电流/力持续超限或保持力不足的确认时间
  recovery_ratio: 0.8
  release_step_raw: 5          # 从实测位置向张开方向调整的寄存器刻度
  release_tolerance_raw: 2
  max_release_raw: 30          # 相对首次保持位置的最大松开量
  max_steps: 6
  move_timeout_ms: 2000
  settle_ms: 2000
  adjust_timeout_ms: 60000
