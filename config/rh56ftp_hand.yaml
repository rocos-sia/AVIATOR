# RH56FTP 启动时加载；修改后重启节点生效。六个通道统一使用下列参数。
# 节点固定设置运动模式 0（按角度运动，带力阈值保护）。
speed: 500                     # 速度寄存器设定，整数 0..1000
force: 1500                     # 力寄存器设定，整数 0..3000；低负载复测起点，需验证握持能力

# 握持自动减载。三项阈值采用原始寄存器整数刻度，直接与反馈比较，不做单位换算。
# 当前已启用；默认值为初始调试值，需结合实机负载验证。
# 阈值可用标量或六项数组：[拇指侧摆, 拇指弯曲, 食指, 中指, 无名指, 小指]。
# 左右手共用；侧摆仅监测，不自动松开。参数变更后重启节点生效。
# 五个弯曲通道已保持或到位后启用长期监测；侧摆误差不阻塞弯曲减载。
# 弯曲抓握/张开期间不累计超限；侧摆自身的长期监测仍需侧摆到位。
hold_control:
  enabled: true
  threshold: 25              # 位置偏移警告阈值，整数 0..1000；绝对偏移大于此值时警告，仅用于诊断
  current_limit: 500          # 电流反馈寄存器刻度，整数 0..2000（设备无对应电流设置指令）
  min_force: 100               # 最低接触/保持力，整数 0..3000；不参与过载减载判定
  temperature_limit: 90       # 温度反馈寄存器刻度，整数 0..100；保持阶段达到即锁存故障
  close_timeout_ms: 30000      # 仍有闭合残差且未确认稳定接触的最长时间
  overload_ms: 1000            # 电流持续超限或保持力不足的确认时间
  recovery_ratio: 0.8         # 电流恢复阈值相对于 current_limit 的比例
  release_step_raw: 5          # 正常从实测位置递增；未到位重试时从上次目标与实测位置的较大值递增
  release_tolerance_raw: 2
  max_release_raw: 30          # 相对首次保持位置的最大松开量
  max_steps: 6
  move_timeout_ms: 2000        # 单步期限；未到位先停止观察，仍超限才在原预算内重试
  settle_ms: 2000
  adjust_timeout_ms: 60000
