# RH56FTP 启动时加载；修改后重启节点生效。命令行参数优先。
right_host: 192.168.21.210
left_host: 192.168.11.210

# 各通道运动时使用 grasp，停止保持时使用 hold；模式固定为 0（按角度运动，带设备力阈值保护）。
speed:
  grasp: 500
  hold: 100
force:
  grasp: 1000
  hold: 100

# 五个弯曲通道闭合时，当前位置 - 指令位置连续 10 秒大于 threshold，发送 -1 停止。
# 拇指侧摆双向适用：位置偏差绝对值连续 10 秒大于 threshold；偏差换向重新计时。
# 寄存器整数刻度，范围 0..999；未配置时默认为 10。保留当前调试值 25。
threshold: 25
