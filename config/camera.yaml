# 相机设备、采集格式与检测参数
# 由 examples/aruco_camera/camera_publisher.py 读取（--config 默认指向本文件）。
camera:
  model: "D436"          # 型号标签；多设备时按名称子串匹配选择（不区分大小写）
  serial: ""             # 序列号；非空则精确选择该设备（优先于 model）
  width: 1280            # 彩色流分辨率
  height: 720
  fps: 30
  depth:                 # 仅传入启用图像的 --recording-config 时启用 Z16；fps 沿用彩色流
    width: 1280
    height: 720
  warmup_s: 5.0          # 启动后跳过发布的热身秒数（0 禁用）

charuco:
  board_size: [5, 5]        # 格子数 (列, 行)
  square_length: 0.016      # 方块边长，米
  marker_length: 0.015      # 标记边长，米
  dictionary: "DICT_4X4_50" # cv2.aruco 预定义字典名
  min_corners: 6            # solvePnP 所需最少角点
