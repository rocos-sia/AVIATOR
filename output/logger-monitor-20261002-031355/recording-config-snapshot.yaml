# aviator_logger 配置 v1
# 启动：aviator_logger --config config/recording.yaml；修改后需重启，不热加载。
# 相机输入/编码约定见 nodes/aviator_logger/README.md 与 docs/Logger配置与图像记录实现说明.md。
config_version: 1

# 只影响存储；full 保留原始窗口，compact 保存反馈游标对应的 record.arm.target。
# 缺失窗口会显式标记；不改变控制总线或执行频率。省略此项默认 full。
arm_command:
  mode: "compact"

bus:
  subscribe_endpoint: "tcp://127.0.0.1:5556"
  receive_hwm: 4096
  queue_bytes: 16777216             # 16 MiB；业务 JSON 队列独立于图像队列

output:
  image_path: ""                    # 空：数据文件同目录 <数据文件名>.images.mcap
  path: ""                          # 空字符串：使用本地启动时间（含微秒）的自动文件名，无 UUID
  # 下列是 MCAP 容器层设置，不是图像编码设置。
  # 三种模式均使用 none，保证 raw 确实不压缩，也避免重复压缩编码图像。
  chunk_compression: "none"
  chunk_size_bytes: 4194304          # 4 MiB 目标值，不是单条消息上限

camera:
  # 只需修改此项即可选择保存策略：
  # disabled   不保存 RGB/深度图像；camera.detection 等业务消息照常记录。
  # raw        保存原始 RGB8 + Z16 帧，不压缩、不缩放、不主动降采样；队列溢出仍会丢帧并计数。
  # compressed RGB 使用有损视频编码，深度使用无损压缩；保持源分辨率/帧率。
  mode: "compressed"                # 枚举：disabled | raw | compressed

  # 原始图像不走控制总线。以下入口/队列仅在 raw/compressed 模式启用。
  # Logger PULL bind、非实时相机适配器 PUSH connect；始终发送原始帧，Logger 编码。
  record_endpoint: "tcp://127.0.0.1:5557"
  receive_hwm: 16                    # 消息数；与字节上限共同约束内存
  max_record_bytes: 16777216         # 16 MiB，包含二进制信封与负载
  queue_bytes: 268435456             # 256 MiB，图像独立预算；需通过带宽实测调整
  overflow_policy: "drop_newest"     # 计数并标记 DEGRADED，不阻塞控制线程

  # 逻辑 camera_id 必须与记录适配器一致，不是型号或 USB 序列号。
  # 相机示例启动时传 --camera-id cockpit --recording-config config/recording.yaml。
  # 这里不配置分辨率/fps；继承并保存采集端实际帧元数据。
  sources:
    - camera_id: "cockpit"
      rgb_topic: "record.camera.cockpit.rgb"
      depth_topic: "record.camera.cockpit.depth"
      record_depth: false             # 默认只录彩色；true 时同时采集并记录 Z16 深度
      rgb_pixel_format: "RGB8"       # 记录接口的未压缩输入格式
      depth_pixel_format: "Z16"      # 启用深度时为 16 位数值，并保存 depth_scale

  # 本段仅在 mode=compressed 时生效，raw 模式完全绕过编码器。
  compressed:
    rgb:
      # 本机无显卡：显式使用 libx264 软件编码；不探测 NVENC。
      codec: "h264"                  # 枚举：h264 | h265
      encoder: "software"            # auto: NVENC 不可用则软件；hardware: 仅 NVENC；software: libx264/libx265
      pixel_format: "yuv420p"        # 编码输入格式；RGB 转换和视频编码均可能损失信息
      target_bitrate_bps: 8000000     # 8 Mbps 目标平均码率，不是瞬时/文件大小硬上限
      keyframe_interval_frames: 30   # 按源 30 fps 时约 1 秒一个关键帧
      b_frames: 0                    # v1 固定为 0，简化时序与回放
    depth:
      codec: "zstd"                  # v1 固定为 Zstd，无损保留 Z16 字节
      level: 3                       # 整数 1..19；压缩率/吞吐需实测
