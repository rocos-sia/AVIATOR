syntax = "proto3";
package aviator.record;

// Stored verbatim as one MCAP protobuf message. The PNG payload is lossless.
message ImageFrame {
  string publisher_id = 1;
  string session_id = 2;
  string camera_id = 3;
  uint64 frame_id = 4;
  uint64 sample_mono_us = 5;
  string clock_id = 6;
  uint32 width = 7;
  uint32 height = 8;
  string pixel_format = 9;
  string encoding = 10;
  bytes data = 11;
  string calibration_id = 12;
}
